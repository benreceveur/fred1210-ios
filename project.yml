name: Fred1210
options:
  # bundleIdPrefix is used by xcodegen only for auto-generating IDs when a
  # target's PRODUCT_BUNDLE_IDENTIFIER isn't set. The real bundle ID comes
  # from Config/Local.xcconfig per developer.
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  # Per-developer values (DEVELOPMENT_TEAM, FRED_DEFAULT_HOST, etc.)
  # are loaded from Config/Local.xcconfig which is gitignored.
  # See Config/Local.xcconfig.example for the template.
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.5.0"
    CURRENT_PROJECT_VERSION: "24"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.6.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.5.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
targets:
  Fred1210:
    type: application
    platform: iOS
    sources:
      - path: Fred1210
        excludes:
          - "**/.DS_Store"
      - path: Shared
    # Explicit Info.plist so the custom FredDefaultHost key gets written
    # into the bundle. Xcode's INFOPLIST_KEY_<Name> only auto-writes for
    # Apple-defined keys — user keys like FredDefaultHost are silently
    # dropped, which is what caused every 2.0.0/2.1.0 build pre-fix to
    # fall back to the unresolvable example host.
    info:
      path: Fred1210/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Fred1210
        UILaunchScreen:
          UILaunchScreen_Generation: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.relayforgelabs.fred1210
            CFBundleURLSchemes:
              - fred1210
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "Fred needs microphone access for voice conversations"
        UIBackgroundModes:
          - remote-notification
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.relayforgelabs.fred1210.refresh
        ITSAppUsesNonExemptEncryption: false
        FredDefaultHost: "$(FRED_DEFAULT_HOST)"
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER comes from Config/Local.xcconfig
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    # Keychain access group so future extensions (share extension,
    # widget, Siri intent, watch app) can read the same host URL and
    # credentials as the main app. The group is namespaced under the
    # app's team identifier prefix (expanded at build time by Xcode).
    entitlements:
      path: Fred1210/Fred1210.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.relayforgelabs.fred1210.shared
        # aps-environment is required for APNs registration. "development"
        # here covers TestFlight; Apple auto-switches to "production" when
        # the build is promoted to the App Store.
        aps-environment: development
        # NSUbiquitousKeyValueStore for syncing the Fred host URL across
        # the user's Apple devices. The identifier follows the standard
        # `<team>.<bundle-id>` convention so iCloud namespaces the KV
        # store per app. FredConfig writes one key here on every host
        # change; new installs adopt the synced value on first launch.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: KeychainAccess
      - target: Fred1210ShareExtension
        embed: true
      - target: Fred1210Widget
        embed: true
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
  Fred1210ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Fred1210
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        # Derive from the xcconfig's MAIN_APP_BUNDLE_ID so this suffix is
        # always the parent app's id + ".share" — Apple requires extension
        # bundle IDs to be prefixed with the container app's id.
        PRODUCT_BUNDLE_IDENTIFIER: $(MAIN_APP_BUNDLE_ID).share
        GENERATE_INFOPLIST_FILE: NO
        # Match parent app's deployment target so Shared Keychain queries
        # work identically.
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # Keychain access group shared with the main app — lets the share
    # extension read the Fred host URL without re-prompting the user.
    entitlements:
      path: ShareExtension/Fred1210ShareExtension.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.relayforgelabs.fred1210.shared

  Fred1210Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Fred1210
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MAIN_APP_BUNDLE_ID).widget
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    entitlements:
      path: Widget/Fred1210Widget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.relayforgelabs.fred1210.shared

  Fred1210Tests:
    type: bundle.unit-test
    platform: iOS
    sources: Fred1210Tests
    dependencies:
      - target: Fred1210
    # Tests don't need a signed bundle ID that matches a real ASC record;
    # a stable local-only id is fine. We do NOT inherit Config/Local.xcconfig
    # here because that would clobber this id with the app's.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fred1210.tests
schemes:
  Fred1210:
    build:
      targets:
        Fred1210: all
    test:
      targets:
        - Fred1210Tests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
