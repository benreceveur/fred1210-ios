name: Fred1210
options:
  # bundleIdPrefix is used by xcodegen only for auto-generating IDs when a
  # target's PRODUCT_BUNDLE_IDENTIFIER isn't set. The real bundle ID comes
  # from Config/Local.xcconfig per developer.
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  # Per-developer values (DEVELOPMENT_TEAM, FRED_DEFAULT_HOST, etc.)
  # are loaded from Config/Local.xcconfig which is gitignored.
  # See Config/Local.xcconfig.example for the template.
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.6.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.2
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.5.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
targets:
  Fred1210:
    type: application
    platform: iOS
    sources:
      - path: Fred1210
        excludes:
          - "**/.DS_Store"
    # Explicit Info.plist so custom keys (FredDefaultHost) make it into
    # the bundle. Xcode's INFOPLIST_KEY_<Name> build setting only works
    # for Apple-defined keys; user keys need to live in a real plist.
    # Xcode's Info.plist preprocessor expands $(VAR) references at build
    # time, so FredDefaultHost picks up the value from Local.xcconfig.
    info:
      path: Fred1210/Info.plist
      properties:
        CFBundleDisplayName: Fred1210
        UILaunchScreen:
          UILaunchScreen_Generation: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Fred needs microphone access for voice conversations"
        UIBackgroundModes:
          - remote-notification
          - audio
        FredDefaultHost: "$(FRED_DEFAULT_HOST)"
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER comes from Config/Local.xcconfig
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: KeychainAccess
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
  Fred1210Tests:
    type: bundle.unit-test
    platform: iOS
    sources: Fred1210Tests
    dependencies:
      - target: Fred1210
    # Tests don't need a signed bundle ID that matches a real ASC record;
    # a stable local-only id is fine. We do NOT inherit Config/Local.xcconfig
    # here because that would clobber this id with the app's.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fred1210.tests
schemes:
  Fred1210:
    build:
      targets:
        Fred1210: all
    test:
      targets:
        - Fred1210Tests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
