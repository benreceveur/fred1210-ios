name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Build + Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Pick the newest installed Xcode 16 that ships an iOS 18 simulator
      # runtime. /Applications/Xcode_16.app (no patch suffix) does not
      # bundle an iOS 18 runtime on macos-15 runners, so `iPhone 16`
      # destinations fail to resolve.
      - name: Select latest installed Xcode 16.x
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode.app
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # Config/Local.xcconfig is gitignored because it holds per-developer
      # values. CI bootstraps it from the committed example so xcodegen's
      # spec validation passes; test/build runs with CODE_SIGNING_ALLOWED=NO
      # so placeholder DEVELOPMENT_TEAM / bundle ID don't matter.
      - name: Bootstrap Config/Local.xcconfig
        run: cp Config/Local.xcconfig.example Config/Local.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      # macos-15 runners freshly booted with Xcode 16.4 occasionally
      # ship the iOS 18 runtime without any pre-created simulator devices,
      # which makes `-destination "name=iPhone 16"` fail with "Unable to
      # find a device matching the provided destination specifier".
      # Create an iPhone 16 simulator on the latest installed iOS runtime
      # if one doesn't already exist.
      - name: Ensure iPhone 16 simulator exists
        run: |
          if xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            echo "iPhone 16 simulator already exists"
          else
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rts=[r for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS']; print(sorted(rts, key=lambda r: r['version'])[-1]['identifier'])")
            echo "Creating iPhone 16 on $RUNTIME"
            xcrun simctl create "iPhone 16" "iPhone 16" "$RUNTIME"
          fi

      - name: Run tests
        run: |
          xcodebuild test \
            -project Fred1210.xcodeproj \
            -scheme Fred1210 \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation

  beta:
    name: TestFlight Upload
    runs-on: macos-15
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
      FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
      FASTLANE_APP_IDENTIFIER: ${{ secrets.FASTLANE_APP_IDENTIFIER }}
      FRED_DEFAULT_HOST: ${{ secrets.FRED_DEFAULT_HOST }}
    steps:
      - uses: actions/checkout@v4

      # Pick the newest installed Xcode 16 that ships an iOS 18 simulator
      # runtime. /Applications/Xcode_16.app (no patch suffix) does not
      # bundle an iOS 18 runtime on macos-15 runners, so `iPhone 16`
      # destinations fail to resolve.
      - name: Select latest installed Xcode 16.x
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode.app
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install xcodegen + fastlane
        run: |
          brew install xcodegen
          brew install fastlane

      # Materialize Config/Local.xcconfig from secrets for the signed beta
      # upload path. Falls back to the committed example when a secret is
      # absent so the file is always valid for xcodegen.
      - name: Bootstrap Config/Local.xcconfig
        run: |
          cp Config/Local.xcconfig.example Config/Local.xcconfig
          if [ -n "$FASTLANE_TEAM_ID" ]; then
            sed -i '' "s|^DEVELOPMENT_TEAM = .*|DEVELOPMENT_TEAM = $FASTLANE_TEAM_ID|" Config/Local.xcconfig
          fi
          if [ -n "$FASTLANE_APP_IDENTIFIER" ]; then
            sed -i '' "s|^PRODUCT_BUNDLE_IDENTIFIER = .*|PRODUCT_BUNDLE_IDENTIFIER = $FASTLANE_APP_IDENTIFIER|" Config/Local.xcconfig
          fi
          if [ -n "$FRED_DEFAULT_HOST" ]; then
            sed -i '' "s|^FRED_DEFAULT_HOST = .*|FRED_DEFAULT_HOST = $FRED_DEFAULT_HOST|" Config/Local.xcconfig
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: fastlane beta
        run: fastlane beta
